name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # The sandbox checks need macOS and are skipped here; the protocol checks all run.
      - run: uv run python tests/test_server.py
      - run: uv run python tests/test_durable.py
      - run: uv run python tests/test_swarm.py
      - run: uv run python tests/test_gateway.py
